<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .box{border: 2px solid indigo;
        height: 100px;
        width: 100px;
        display: inline-block;}


        #box1{background-color: blue;
            position: fixed;
            top: 0%;
            left: 0%;}

        #box2{background-color: green;
            position: fixed;
            bottom: 0%;
            left: 0%;}

        #box3{background-color: red;
            position: fixed;
            top: 0%;
            right: 0%;}

        #box4{background-color: yellow;
            position: fixed;
            bottom: 0%;
            right: 0%;}

        #box5{background-color: pink;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);}

    </style>
</head>
<body>

    <div id="box1" class="box">box1</div>
    <div id="box2" class="box">box2</div>
    <div id="box3" class="box">box3</div>
    <div id="box4" class="box">box4</div>
    <div id="box5" class="box">box5</div>
    
</body>
</html>
